# HPICDA PIPELINE_INDEX — 权威执行索引(2026-09-05 归一化)
# 用途:替代早期 run_pipeline.py 骨架,诚实记录 48 个脚本的真实执行顺序、
#       输入/输出、检查点、门控依赖与可重跑性。
# 重要事实:
#   - 全流程从未做过端到端无人值守重跑;各阶段在沙箱中按序执行并经检查点锁定。
#   - rerunnable: "yes"   = 输入在包内且脚本可独立重跑
#                 fetch = 需先运行 03_functional_screens/raw/fetch_raw_data.sh 取回外部数据
#                 manual= 含人工门控/交互修订/外部 staging,重跑需人工介入
#   - 检查点记录的是 脚本/输入/输出 的 SHA256(18_checkpoints/<stage_id>.json)。
#   - R7/R8/R10 检查点未记录脚本哈希(早期版本),脚本归属依据执行笔记本与 runinfo。

phases:
  - id: main
    label: 主体管线 Stage 0–12(2026-08-29 → 09-01)
  - id: revision
    label: 修订分析 R1–R14(Plan v2/v3)
  - id: governance
    label: 治理(HG0–HG4 门控,批准件在 18_human_reviews/)
  - id: post_hg4
    label: HG4 解锁后 Stage 13/14/15(2026-09-02/03)
  - id: expert_review
    label: 专家 20 条意见闭环补充(2026-09-04)
  - id: closing
    label: 收尾三项 + 复现包审计(2026-09-04/05)

